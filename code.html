<!DOCTYPE html>
<html>
<head>
<title>Product Catalog</title>

<style>

body{
font-family: Arial;
background-color:#f5f7fb;
text-align:center;
}

h2{
color:#333;
}

table{
border-collapse: collapse;
width:70%;
margin:auto;
margin-bottom:30px;
background:white;
}

th{
background-color:#4CAF50;
color:white;
padding:10px;
}

td{
border:1px solid #ddd;
padding:8px;
}

tr:hover{
background-color:#f1f1f1;
}

button{
padding:6px 12px;
border:none;
border-radius:5px;
cursor:pointer;
font-weight:bold;
}

.addBtn{
background-color:#2196F3;
color:white;
}

.addBtn:hover{
background-color:#0b7dda;
}

.removeBtn{
background-color:#f44336;
color:white;
}

.removeBtn:hover{
background-color:#d32f2f;
}

</style>

</head>

<body>

<h2>Product Catalog</h2>

<table id="productTable">
<tr>
<th>ID</th>
<th>Name</th>
<th>Price</th>
<th>Brand</th>
<th>Action</th>
</tr>
</table>

<h2>Shopping Cart</h2>

<table id="cartTable">
<tr>
<th>ID</th>
<th>Name</th>
<th>Price</th>
<th>Action</th>
</tr>
</table>

<script id="productXML" type="text/xml">

<catalog>

<product>
<id>101</id>
<name>Laptop</name>
<price>55000</price>
<brand>Dell</brand>
</product>

<product>
<id>102</id>
<name>Smartphone</name>
<price>25000</price>
<brand>Samsung</brand>
</product>

<product>
<id>103</id>
<name>Headphones</name>
<price>3000</price>
<brand>Sony</brand>
</product>

<product>
<id>104</id>
<name>Smartwatch</name>
<price>7000</price>
<brand>Noise</brand>
</product>

<product>
<id>105</id>
<name>Tablet</name>
<price>18000</price>
<brand>Lenovo</brand>
</product>

<product>
<id>106</id>
<name>Bluetooth Speaker</name>
<price>4500</price>
<brand>JBL</brand>
</product>

<product>
<id>107</id>
<name>Keyboard</name>
<price>1200</price>
<brand>Logitech</brand>
</product>

<product>
<id>108</id>
<name>Mouse</name>
<price>800</price>
<brand>HP</brand>
</product>

</catalog>

</script>

<script>

var parser = new DOMParser();
var xml = parser.parseFromString(
document.getElementById("productXML").textContent,
"text/xml"
);

var products = xml.getElementsByTagName("product");
var table = document.getElementById("productTable");

for(var i=0;i<products.length;i++){

let id = products[i].getElementsByTagName("id")[0].textContent;
let name = products[i].getElementsByTagName("name")[0].textContent;
let price = products[i].getElementsByTagName("price")[0].textContent;
let brand = products[i].getElementsByTagName("brand")[0].textContent;

var row = table.insertRow();

row.insertCell(0).innerHTML = id;
row.insertCell(1).innerHTML = name;
row.insertCell(2).innerHTML = price;
row.insertCell(3).innerHTML = brand;

var btn = document.createElement("button");
btn.innerHTML = "Add to Cart";
btn.className = "addBtn";

btn.onclick = function(){
addToCart(id,name,price);
};

row.insertCell(4).appendChild(btn);

}

function addToCart(id,name,price){

var cart = document.getElementById("cartTable");
var row = cart.insertRow();

row.insertCell(0).innerHTML = id;
row.insertCell(1).innerHTML = name;
row.insertCell(2).innerHTML = price;

var btn = document.createElement("button");
btn.innerHTML = "Remove";
btn.className = "removeBtn";

btn.onclick = function(){
cart.deleteRow(row.rowIndex);
};

row.insertCell(3).appendChild(btn);

}

</script>

</body>
</html>
